version: '3.8'

services:
  db:
    image: postgres:16
    env_file: .env.prod
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: dms-backend:latest
    env_file: .env.prod
    command: gunicorn --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 main:app --access-logfile /tmp/log.txt
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - document_storage:/app/storage/uploads
    networks:
      - app-network
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: dms-backend:latest
    command: alembic upgrade head
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

volumes:
  db_data:
  document_storage:

networks:
  app-network:
    driver: bridge