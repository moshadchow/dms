server {
    listen 80;
    server_name 103.244.247.84;

    root /var/www/dms/dms-app/dist;
    index index.html;
    client_max_body_size 50M;

    # Backend — health + api routes + docs
    location ~ ^/(health|api|docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve JS modules with an explicit MIME type for pdf.js worker assets.
    location ~* \.(mjs|js)$ {
        types {
            application/javascript mjs js;
        }
        try_files $uri =404;
    }

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
