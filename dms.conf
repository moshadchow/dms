# ── Edge rate limiting (spec 31) ──────────────────────────────
# limit_req_zone is valid only in http context; this file is included
# from nginx's http {} block, so a directive here is correct. This nginx
# is the trust boundary (no proxy in front), so $binary_remote_addr is
# the real client IP. 10 r/s matches the app default (600/min); nodelay
# burst absorbs normal page-load parallelism. Rejections answer 429 like
# the app-level middleware (middleware/ratelimit.py).
limit_req_zone $binary_remote_addr zone=dms_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;

    server_name dms.xpertfintech.com;

    # ACME http-01 challenges must stay on plain HTTP (certbot webroot);
    # everything else upgrades to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dms/dms-app/dist;
    }

    location / {
        return 308 https://dms.xpertfintech.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dms.xpertfintech.com;

    root /var/www/dms/dms-app/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/dms.xpertfintech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dms.xpertfintech.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dms.xpertfintech.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:secp384r1;
    ssl_session_cache shared:DMS_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 100M;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        # Per-client throttle before requests reach uvicorn (spec 31).
        # The app's middleware/ratelimit.py is the second, stricter filter;
        # both answer 429. burst=60 nodelay covers page-load parallelism.
        limit_req zone=dms_api burst=60 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/dms_access.log;
    error_log /var/log/nginx/dms_error.log;
}
