server {
    listen 80;
    listen [::]:80;

    server_name dms.xpertfintech.com;

    return 301 https://dms.xpertfintech.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dms.xpertfintech.com;

    root /var/www/dms/dms-app/dist;
    index index.html;

    ssl_certificate /etc/nginx/ssl/dms.xpertfintech.com/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/dms.xpertfintech.com/private.key;
    ssl_trusted_certificate /etc/nginx/ssl/dms.xpertfintech.com/trusted-chain.crt;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DMS_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 100M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/dms_access.log;
    error_log /var/log/nginx/dms_error.log;
}
